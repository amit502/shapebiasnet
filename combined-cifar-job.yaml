# combined-cifar-job.yaml
# ─────────────────────────────────────────────────────────────
# Full pipeline: clone → train (CIFAR) → clean eval → corrupt eval
#
# EXPERIMENT GROUPS — use --run_group <name> or --model <name>
#
# ── CIFAR-compatible model families ─────────────────────────────────────
#   (ResNet only — ConvNeXt/EfficientNet have no CIFAR head patch)
#
#   BASELINES:
#     baseline_res18 / baseline_res34 / baseline_res50 / baseline_res101
#
#   FDN (Frequency-Decoupled Normalization):
#     fdn_res18 / fdn_res34 / fdn_res50 / fdn_res101
#
#   INSC (full — works on shallow, unstable on deep):
#     insc_res18 / insc_res34 / insc_res50 / insc_res101
#     fdn_insc_res18 / fdn_insc_res34 / fdn_insc_res50 / fdn_insc_res101
#
#   VarSupp  ★ main contribution (var-suppression branch):
#     Zero-parameter texture debiasing. Reweights channels by inverse spatial
#     variance after each residual stage. Texture channels (high variance) are
#     suppressed; structure channels (low variance) amplified. Self-calibrating.
#     vsupp_res18 / vsupp_res34 / vsupp_res50 / vsupp_res101
#
#   CMConv (complex-modulus-conv branch — ablation):
#     cmconv_res18 / cmconv_res34 / cmconv_res50 / cmconv_res101
#     cmconv_abs_res18 / cmconv_abs_res34 / cmconv_abs_res50 / cmconv_abs_res101
#
#   SDN (Spectral Decoupled Normalization — freq-norm branch):
#     sdn_res18 / sdn_res34 / sdn_res50 / sdn_res101
#     sdn_ginsc_res18 / sdn_ginsc_res34 / sdn_ginsc_res50 / sdn_ginsc_res101
#
#   FDN+GINSC (ablation):
#     ginsc_res18 / ginsc_res34 / ginsc_res50 / ginsc_res101
#     fdn_ginsc_res18 / fdn_ginsc_res34 / fdn_ginsc_res50 / fdn_ginsc_res101
#
#   ShapeBiasNet (dual-stream, for comparison):
#     shape_custom / shape_res18 / shape_res34 / shape_res50 / shape_res101
#
# ── Run groups (defined in train.py) ────────────────────────────────────
#   SDN (main CIFAR contribution):
#     sdn_ginsc_res50  : baseline_res50 + sdn_ginsc_res50
#     sdn_ginsc_res101 : baseline_res101 + sdn_ginsc_res101
#   cifar_all          : all baseline + shape models (legacy)
#   fdn_ginsc_res50    : baseline_res50 + fdn_ginsc_res50
#   fdn_ginsc_res101   : baseline_res101 + fdn_ginsc_res101
#   ablation_gate_res50  : baseline + fdn_insc_res50 + fdn_ginsc_res50
#   ablation_gate_res101 : baseline + fdn_insc_res101 + fdn_ginsc_res101
#   ablation_fn_res50    : baseline + fdn + insc + fdn_insc (res50)
#   ablation_fn_res101   : baseline + fdn + insc + fdn_insc (res101)
#
# ── Dataset switch ───────────────────────────────────────────────────────
#   cifar10  : change --dataset cifar10  --data_dir /pvc/cifar10
#   cifar100 : change --dataset cifar100 --data_dir /pvc/cifar100
#              (also update job name and eval --data_dir accordingly)
#
# ── Training defaults (train.py) ─────────────────────────────────────────
#   epochs  : 40   (increase to 100-200 for publication-quality results)
#   batch   : 128
#   workers : 2 (overridden to 4 below)
#   lr      : 0.1
#
# Nautilus resource policy:
#   CPU  request=3, limit=3
#   RAM  request=8Gi, limit=10Gi
#   GPU  request=1, limit=1   -> limits == requests
#   backoffLimit=0 — fail fast, investigate manually
#
# Submit:  kubectl apply -f combined-cifar-job.yaml
# Logs:    kubectl logs -f job/pcn-res50-cifar100-img -n kc-ai-research-lab
# Delete:  kubectl delete job pcn-res50-cifar100-img -n kc-ai-research-lab
# ─────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: pcn-res50-cifar100-img
  namespace: kc-ai-research-lab
spec:
  backoffLimit: 0

  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      # - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-RTX-5000-Ada-Generation

      containers:
        - name: pipeline
          image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime

          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e

              # ── Step 0: Clone repo ────────────────────────────
              echo "=========================================="
              echo "  Step 0: Cloning repo (branch: var-suppression)"
              echo "=========================================="
              apt-get update -qq && apt-get install -y -qq git
              git clone \
                --branch var-suppression \
                --single-branch \
                https://${GITHUB_PAT}@github.com/amit502/shapebiasnet.git \
                /shapebiasnet
              cd /shapebiasnet

              # ── Step 1: Dependencies ──────────────────────────
              echo ""
              echo "=========================================="
              echo "  Step 1: Installing dependencies"
              echo "=========================================="
              pip install -r requirements.txt --quiet

              # ── Create output dirs on PVC ─────────────────────
              mkdir -p /pvc/checkpoints /pvc/results

              # Clear any leftover GPU memory from previous jobs
              fuser -k /dev/nvidia* 2>/dev/null || true

              # ── Step 2: Train ─────────────────────────────────
              # CIFAR: 50K train / 10K test, 32x32 images.
              # 40 epochs to match baseline runs.
              # Auto-resumes from checkpoint if job was preempted.
              echo ""
              echo "=========================================="
              echo "  Step 2: Training (CIFAR-100, clean data only)"
              echo "=========================================="
              python -u train.py \
                --model       pcn_res50 \
                --dataset     cifar100 \
                --data_dir    /pvc/cifar100 \
                --ckpt_dir    /pvc/checkpoints \
                --epochs      40 \
                --batch       128 \
                --workers     4

              # ── Step 3: Full Evaluation (clean + corruption) ──
              echo ""
              echo "=========================================="
              echo "  Step 3: Full Evaluation (CIFAR-100 test + CIFAR-100-C)"
              echo "=========================================="
              python -u eval.py \
                --model       pcn_res50 \
                --dataset     cifar100 \
                --data_dir    /pvc/cifar100 \
                --ckpt_dir    /pvc/checkpoints \
                --results_dir /pvc/results \
                --batch       128 \
                --workers     4 \
                || echo "  [WARN] Eval failed — check logs."

              # ── Done ──────────────────────────────────────────
              echo ""
              echo "=========================================="
              echo "  Pipeline complete. Results:"
              echo "=========================================="
              ls -lh /pvc/results/
              ls -lh /pvc/checkpoints/

          resources:
            requests:
              cpu: "3"
              memory: "9Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "3"
              memory: "10Gi"
              nvidia.com/gpu: "1"

          env:
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: github-pat
                  key: token
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: PYTHONUNBUFFERED
              value: "1"

          volumeMounts:
            - name: data
              mountPath: /pvc
            - name: shm
              mountPath: /dev/shm

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shape-resnet-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi

      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
