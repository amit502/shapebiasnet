# combined-job.yaml
# ─────────────────────────────────────────────────────────────
# Full pipeline: clone → train → clean eval → corrupt eval → profile
#
# EXPERIMENT GROUPS — edit --run_group / --eval_group to select:
#
#   ImageNet-100 (current):
#     imagenet100_core     : baseline_res50 + shape_res50
#     imagenet100_deep     : baseline_res101 + shape_res101
#     imagenet100_convnext : baseline_convnext_tiny + shape_convnext_tiny
#     imagenet100_effnet   : baseline_efficientnet_b4 + shape_effnet_b4
#     imagenet100_all      : all rounds combined
#
#   Full ImageNet (switch --dataset imagenet and --data_dir /pvc/imagenet):
#     imagenet_core / imagenet_deep / imagenet_convnext / imagenet_effnet / imagenet_all
#
# To run a SINGLE model replace --run_group with --model <name>
#
# Nautilus resource policy:
#   CPU  request=5, limit=6   → ratio 6/5 = 1.2 exactly  ✓
#   RAM  request=20Gi, limit=24Gi → ratio 24/20 = 1.2 exactly  ✓
#   GPU  request=1, limit=1   → limits == requests  ✓
#   backoffLimit=0 — fail fast, investigate manually  ✓
#
# Submit:  kubectl apply -f k8s/combined-job.yaml
# Logs:    kubectl logs -f job/shape-resnet-pipeline -n kc-ai-research-lab
# Delete:  kubectl delete job shape-resnet-pipeline -n kc-ai-research-lab
# ─────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: shape-resnet-pipeline
  namespace: kc-ai-research-lab
spec:
  backoffLimit: 0

  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-RTX-5000-Ada-Generation

      containers:
        - name: pipeline
          image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime

          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e

              # ── Step 0: Clone repo ────────────────────────────
              echo "=========================================="
              echo "  Step 0: Cloning repo (branch: review)"
              echo "=========================================="
              apt-get update -qq && apt-get install -y -qq git
              git clone \
                --branch review \
                --single-branch \
                https://${GITHUB_PAT}@github.com/amit502/shapebiasnet.git \
                /shapebiasnet
              cd /shapebiasnet

              # ── Step 1: Dependencies ──────────────────────────
              echo ""
              echo "=========================================="
              echo "  Step 1: Installing dependencies"
              echo "=========================================="
              pip install -r requirements.txt --quiet

              # ── Create output dirs on PVC ─────────────────────
              mkdir -p /pvc/checkpoints /pvc/results

              # ── Step 2: Train ─────────────────────────────────
              # ImageNet-100: 100 classes, ~128K images.
              # Much faster than full ImageNet — ~2-3 min/epoch on RTX 3090/5000.
              # Auto-resumes from checkpoint if job was preempted.
              echo ""
              echo "=========================================="
              echo "  Step 2: Training (ImageNet-100, clean data only)"
              echo "=========================================="
              python -u train.py \
                --run_group   imagenet100_core \
                --dataset     imagenet100 \
                --data_dir    /pvc/imagenet100 \
                --ckpt_dir    /pvc/checkpoints \
                --epochs      90 \
                --batch       256 \
                --workers     4

              # ── Step 3: Clean Evaluation ──────────────────────
              echo ""
              echo "=========================================="
              echo "  Step 3: Clean Evaluation (ImageNet-100 val)"
              echo "=========================================="
              python -u eval.py \
                --eval_group  imagenet100_core \
                --dataset     imagenet100 \
                --data_dir    /pvc/imagenet100 \
                --ckpt_dir    /pvc/checkpoints \
                --results_dir /pvc/results \
                --batch       256 \
                --workers     4 \
                --clean_only

              # ── Step 4: Corruption Evaluation ─────────────────
              # Non-fatal — if ImageNet-100-C not ready, prints warning and continues.
              echo ""
              echo "=========================================="
              echo "  Step 4: Corruption Evaluation (ImageNet-100-C)"
              echo "=========================================="
              python -u eval.py \
                --eval_group  imagenet100_core \
                --dataset     imagenet100 \
                --data_dir    /pvc/imagenet100 \
                --ckpt_dir    /pvc/checkpoints \
                --results_dir /pvc/results \
                --batch       256 \
                --workers     4 \
                --corrupt_only || echo "  [WARN] Corrupt eval failed — ImageNet-100-C may not be ready."

              # ── Step 5: Efficiency Profiling ──────────────────
              echo ""
              echo "=========================================="
              echo "  Step 5: Efficiency Profiling"
              echo "=========================================="
              python profiler.py \
                --dataset     imagenet \
                --results_dir /pvc/results \
                --warmup      20 \
                --runs        100 || echo "  [WARN] Profiling failed — check logs."

              # ── Done ──────────────────────────────────────────
              echo ""
              echo "=========================================="
              echo "  Pipeline complete. Results:"
              echo "=========================================="
              ls -lh /pvc/results/
              ls -lh /pvc/checkpoints/

          resources:
            requests:
              cpu: "3"
              memory: "10Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "3" # 6/5 = 1.2 exactly ✓
              memory: "12Gi" # 24/20 = 1.2 exactly ✓
              nvidia.com/gpu: "1" # limits == requests ✓

          env:
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: github-pat
                  key: token
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: PYTHONUNBUFFERED
              value: "1"

          volumeMounts:
            - name: data
              mountPath: /pvc
            - name: shm
              mountPath: /dev/shm

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shape-resnet-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi

      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
