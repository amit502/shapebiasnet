# combined-job.yaml
# ─────────────────────────────────────────────────────────────
# Full pipeline: clone → train → clean eval → corrupt eval → profile
#
# EXPERIMENT GROUPS — use --run_group <name> or --model <name>
#
# ── All model families (41 total) ───────────────────────────────────────
#
#   BASELINES  (vanilla backbone, no modification):
#     baseline_res18 / baseline_res34 / baseline_res50 / baseline_res101
#     baseline_convnext_tiny / baseline_convnext_base
#     baseline_efficientnet_b0 / baseline_efficientnet_b4
#
#   PMCONV-L  (pmconv-scale branch — Lorentzian, fixed k, n_steps=1)
#     Per-channel Lorentzian conductance (no exp), fixed k=0.3, 1 step per conv.
#     Measured ~2.5x overhead vs baseline (many per-channel divisions).
#     pmconv_l_res18 / pmconv_l_res34 / pmconv_l_res50 / pmconv_l_res101
#     pmconv_l_convnext_tiny / pmconv_l_convnext_base
#     pmconv_l_effnet_b0 / pmconv_l_effnet_b4
#
#   PMCONV-A  ★ main contribution — this branch (pmconv-adaptive)
#     Same Perona-Malik anisotropic diffusion as pmconv_l, two improvements:
#       1. Shared conductance: gradient magnitude averaged across channels →
#          single division per spatial position (vs C divisions in pmconv_l).
#          ~C× fewer divisions per layer; effectively reduces PM overhead ~3-5×.
#       2. Learnable k per layer: each conv learns its own conductance threshold
#          (log-parameterized scalar). Shallow layers keep small k (fine edges);
#          deep layers may grow k (blur block artifacts / pixelation semantically).
#     Principled story: Lorentzian energy E = k²·log(1+|∇|²/k²) minimization;
#     learned k = depth-adaptive shape-regularization strength.
#     pmconv_a_res18 / pmconv_a_res34 / pmconv_a_res50 / pmconv_a_res101
#     pmconv_a_convnext_tiny / pmconv_a_convnext_base
#     pmconv_a_effnet_b0 / pmconv_a_effnet_b4
#
#   ROBUSTCONV  (ablation — isotropic Laplacian diffusion Conv):
#     Same as PMConv but isotropic — blurs edges, network can compensate.
#     robustconv_res18 / robustconv_res34 / robustconv_res50 / robustconv_res101
#     robustconv_convnext_tiny / robustconv_convnext_base
#     robustconv_effnet_b0 / robustconv_effnet_b4
#
#   SHAPEBIASNET  (dual-stream, for comparison):
#     shape_custom / shape_res18 / shape_res34 / shape_res50 / shape_res101
#     shape_convnext_tiny / shape_convnext_base
#     shape_effnet_b0 / shape_effnet_b4
#
# ── Run groups ───────────────────────────────────────────────────────────
#
#   PMConv-A (this branch — adaptive k, shared conductance):
#     pmconv_a_res50     : baseline_res50    + pmconv_a_res50
#     pmconv_a_res101    : baseline_res101   + pmconv_a_res101
#     pmconv_a_convnext  : baseline_convnext_tiny + pmconv_a_convnext_tiny
#     pmconv_a_effnet    : baseline_efficientnet_b4 + pmconv_a_effnet_b4
#     pmconv_a_all       : all four backbone pairs
#
#   L vs A ablation (fixed-k vs learnable-k):
#     ablation_a_res50   : baseline + robustconv + pmconv_l + pmconv_a  (res50)
#     ablation_a_res101  : baseline + robustconv + pmconv_l + pmconv_a  (res101)
#
#   PMConv-L (pmconv-scale branch — kept for reference):
#     pmconv_l_res50 / pmconv_l_res101 / pmconv_l_convnext / pmconv_l_effnet
#     pmconv_l_all
#
#   Full ablation (four-way: baseline / isotropic / anisotropic-L / dual-stream):
#     ablation_res50 / ablation_res101
#
#   RobustConv (isotropic ablation only):
#     robustconv_res50 / robustconv_res101 / robustconv_all
#
#   ShapeBiasNet (dual-stream):
#     imagenet100_core / imagenet100_deep / imagenet100_convnext / imagenet100_effnet
#     imagenet100_all
#
# To run a SINGLE model: replace --run_group with --model <name>
#
# Nautilus resource policy:
#   CPU  request=3, limit=3
#   RAM  request=10Gi, limit=12Gi
#   GPU  request=1, limit=1   → limits == requests  ✓
#   backoffLimit=0 — fail fast, investigate manually  ✓
#
# Submit:  kubectl apply -f combined-job.yaml
# Logs:    kubectl logs -f job/pmconv-a-res101-img -n kc-ai-research-lab
# Delete:  kubectl delete job pmconv-a-res101-img -n kc-ai-research-lab
# ─────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: pmconv-a-res101-img
  namespace: kc-ai-research-lab
spec:
  backoffLimit: 0

  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      # - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-RTX-5000-Ada-Generation

      containers:
        - name: pipeline
          image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime

          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e

              # ── Step 0: Clone repo ────────────────────────────
              echo "=========================================="
              echo "  Step 0: Cloning repo (branch: pmconv-adaptive)"
              echo "=========================================="
              apt-get update -qq && apt-get install -y -qq git
              git clone \
                --branch pmconv-adaptive \
                --single-branch \
                https://${GITHUB_PAT}@github.com/amit502/shapebiasnet.git \
                /shapebiasnet
              cd /shapebiasnet

              # ── Step 1: Dependencies ──────────────────────────
              echo ""
              echo "=========================================="
              echo "  Step 1: Installing dependencies"
              echo "=========================================="
              pip install -r requirements.txt --quiet

              # ── Create output dirs on PVC ─────────────────────
              mkdir -p /pvc/checkpoints /pvc/results

              # Clear any leftover GPU memory from previous jobs
              fuser -k /dev/nvidia* 2>/dev/null || true

              # ── Step 2: Train ─────────────────────────────────
              # ImageNet-100: 100 classes, ~128K images.
              # Much faster than full ImageNet — ~2-3 min/epoch on RTX 3090/5000.
              # Auto-resumes from checkpoint if job was preempted.
              echo ""
              echo "=========================================="
              echo "  Step 2: Training (ImageNet-100, clean data only)"
              echo "=========================================="
              python -u train.py \
                --model       pmconv_a_res101 \
                --dataset     imagenet100 \
                --data_dir    /pvc/imagenet100 \
                --ckpt_dir    /pvc/checkpoints \
                --epochs      50 \
                --batch       64 \
                --workers     8 

              # ── Step 3: Full Evaluation (clean + corruption) ──
              echo ""
              echo "=========================================="
              echo "  Step 3: Full Evaluation (ImageNet-100 val + ImageNet-100-C)"
              echo "=========================================="
              python -u eval.py \
                --model       pmconv_a_res101 \
                --dataset     imagenet100 \
                --data_dir    /pvc/imagenet100 \
                --ckpt_dir    /pvc/checkpoints \
                --results_dir /pvc/results \
                --batch       64 \
                --workers     8 \
                || echo "  [WARN] Eval failed — ImageNet-100-C may not be ready."

              # # ── Step 5: Efficiency Profiling ──────────────────
              # echo ""
              # echo "=========================================="
              # echo "  Step 5: Efficiency Profiling"
              # echo "=========================================="
              # python profiler.py \
              #   --dataset     imagenet \
              #   --results_dir /pvc/results \
              #   --warmup      20 \
              #   --runs        100 || echo "  [WARN] Profiling failed — check logs."

              # ── Done ──────────────────────────────────────────
              echo ""
              echo "=========================================="
              echo "  Pipeline complete. Results:"
              echo "=========================================="
              ls -lh /pvc/results/
              ls -lh /pvc/checkpoints/

          resources:
            requests:
              cpu: "3"
              memory: "10Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "3" # 6/5 = 1.2 exactly ✓
              memory: "12Gi" # 24/20 = 1.2 exactly ✓
              nvidia.com/gpu: "1" # limits == requests ✓

          env:
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: github-pat
                  key: token
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: PYTHONUNBUFFERED
              value: "1"

          volumeMounts:
            - name: data
              mountPath: /pvc
            - name: shm
              mountPath: /dev/shm

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shape-resnet-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi

      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
