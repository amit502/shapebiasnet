# combined-job.yaml
# ─────────────────────────────────────────────────────────────
# Full pipeline: clone → train → clean eval → corrupt eval → profile
#
# EXPERIMENT GROUPS — use --run_group <name> or --model <name>
#
# ── All model families ───────────────────────────────────────────────────
#
#   BASELINES  (vanilla backbone, no modification):
#     baseline_res18 / baseline_res34 / baseline_res50 / baseline_res101
#     baseline_convnext_tiny / baseline_convnext_base
#     baseline_efficientnet_b0 / baseline_efficientnet_b4
#
#   FDN  ★ this branch (freq-norm) — Frequency-Decoupled Normalization
#     Drop-in BN replacement: splits feature map into LF (AvgPool) + HF (x-LF),
#     applies BN to LF and IN to HF. Principled axis: frequency (not channel).
#     Closest prior: IBN-Net (ECCV 2018) — channel split; FDN uses frequency split.
#     Near-zero overhead (two extra norm passes per BN layer).
#     NOTE: no-op for ConvNeXt (uses LayerNorm, not BN2d).
#     fdn_res18 / fdn_res34 / fdn_res50 / fdn_res101
#     fdn_convnext_tiny / fdn_convnext_base
#     fdn_effnet_b0 / fdn_effnet_b4
#
#   INSC  ★ this branch (freq-norm) — Instance-Normalized Skip Connections
#     Applies IN to the skip (identity) branch before residual add: F(x) + IN(x).
#     Motivated by predictive coding: IN strips instance-level texture statistics,
#     forcing the residual highway to carry shape/structure not texture noise.
#     Closest prior: ResNorm (DCASE 2021, audio spectrograms) — same formula,
#     different domain. INSC is the first application to image CNNs.
#     Near-zero overhead (one IN per residual block).
#     insc_res18 / insc_res34 / insc_res50 / insc_res101
#     insc_convnext_tiny / insc_convnext_base
#     insc_effnet_b0 / insc_effnet_b4
#
#   SDN  ★ this branch (freq-norm) — Spectral Decoupled Normalization
#     Replaces FDN's AvgPool split with an exact FFT Gaussian mask:
#       mask = exp(-(u²+v²)/2σ²)  (unshifted FFT grid, learnable σ per layer)
#     x_lf = ifft(X·mask),  x_hf = ifft(X·(1-mask))
#     Same output: BN(x_lf) + IN(x_hf). Fixes FDN degeneracy at CIFAR 4×4 maps.
#     ResNet only (CIFAR + ImageNet):
#     sdn_res18 / sdn_res34 / sdn_res50 / sdn_res101  (SDN only)
#     sdn_ginsc_res18 / sdn_ginsc_res34 / sdn_ginsc_res50 / sdn_ginsc_res101  ★
#
#   FDN+INSC  (full INSC — works on shallow nets, unstable on deep):
#     Both FDN and INSC applied together. Full IN on every skip connection.
#     Results: fdn_insc_res50 → 84.16% clean / 48.15% mCA ✓
#              fdn_insc_res101 → 80.74% clean / 44.55% mCA ✗ (deep instability)
#     fdn_insc_res18 / fdn_insc_res34 / fdn_insc_res50 / fdn_insc_res101
#     fdn_insc_convnext_tiny / fdn_insc_convnext_base
#     fdn_insc_effnet_b0 / fdn_insc_effnet_b4
#
#   FDN+GINSC  ★ main contribution — Gated INSC (learnable per-block gate)
#     Replaces fixed INSC with a learnable scalar gate g=sigmoid(param) per block:
#       out = (1-g)·identity + g·IN(identity)
#     Gate initialized to sigmoid(-3)≈0.047 → starts as standard ResNet.
#     Network learns WHERE texture stripping is beneficial:
#       shallow layers → g≈0 (preserve spatial structure)
#       deep layers    → g≈1 (strip texture for shape-based representations)
#     Architecture-agnostic: handles ResNet, ConvNeXt, EfficientNet.
#     Near-zero overhead. Fixes the deep-network instability of full INSC.
#     Interpretable: learned gate values visualize the texture-shape hierarchy.
#     ginsc_res18 / ginsc_res34 / ginsc_res50 / ginsc_res101  (GINSC only)
#     fdn_ginsc_res18 / fdn_ginsc_res34 / fdn_ginsc_res50 / fdn_ginsc_res101
#     fdn_ginsc_convnext_tiny / fdn_ginsc_convnext_base
#     fdn_ginsc_effnet_b0 / fdn_ginsc_effnet_b4
#
#   CMCONV  ★ main contribution (complex-modulus-conv branch)
#     Replaces spatial (k>1) Conv2d with complex conv + modulus nonlinearity.
#     y = sqrt((W_r*x)² + (W_i*x)²). Amplitude = deformation-stable; phase discarded.
#     Inherits Mallat (2012) scattering stability guarantee with learned filters.
#     Universal: works on ResNet, ConvNeXt, EfficientNet (replaces nn.Conv2d directly).
#     ~1.5× param overhead (vs 2× if 1×1 convs also replaced — kept as standard).
#     cmconv_res18 / cmconv_res34 / cmconv_res50 / cmconv_res101
#     cmconv_convnext_tiny / cmconv_convnext_base
#     cmconv_effnet_b0 / cmconv_effnet_b4
#
#   PMCONV-L  (pmconv-scale branch — reference, +2.14% mCA on res101)
#     Per-channel Lorentzian PM anisotropic diffusion before every Conv2d.
#     Fixed k=0.3, n_steps=1. ~2.5x overhead vs baseline.
#     pmconv_l_res18 / pmconv_l_res34 / pmconv_l_res50 / pmconv_l_res101
#     pmconv_l_convnext_tiny / pmconv_l_convnext_base
#     pmconv_l_effnet_b0 / pmconv_l_effnet_b4
#
#   ROBUSTCONV  (ablation — isotropic Laplacian diffusion Conv):
#     Same as PMConv but isotropic — blurs edges, network can compensate.
#     robustconv_res18 / robustconv_res34 / robustconv_res50 / robustconv_res101
#     robustconv_convnext_tiny / robustconv_convnext_base
#     robustconv_effnet_b0 / robustconv_effnet_b4
#
#   SHAPEBIASNET  (dual-stream, for comparison):
#     shape_custom / shape_res18 / shape_res34 / shape_res50 / shape_res101
#     shape_convnext_tiny / shape_convnext_base
#     shape_effnet_b0 / shape_effnet_b4
#
# ── Run groups ───────────────────────────────────────────────────────────
#
#   FDN+GINSC (main contribution — run these):
#     fdn_ginsc_res50    : baseline_res50    + fdn_ginsc_res50
#     fdn_ginsc_res101   : baseline_res101   + fdn_ginsc_res101
#     fdn_ginsc_convnext : baseline_convnext_tiny + fdn_ginsc_convnext_tiny
#     fdn_ginsc_effnet   : baseline_efficientnet_b4 + fdn_ginsc_effnet_b4
#     fdn_ginsc_all      : all four backbone pairs
#
#   Gate ablation (full INSC vs gated INSC):
#     ablation_gate_res50  : baseline + fdn_insc_res50  + fdn_ginsc_res50
#     ablation_gate_res101 : baseline + fdn_insc_res101 + fdn_ginsc_res101
#
#   FDN+INSC (full INSC — reference, already run):
#     fdn_insc_res50 ✓ / fdn_insc_res101 ✓ / fdn_insc_convnext / fdn_insc_effnet
#     fdn_insc_all
#
#   FDN ablation (FDN only):
#     fdn_res50 / fdn_res101 / fdn_convnext / fdn_effnet / fdn_all
#
#   INSC ablation (INSC only):
#     insc_res50 / insc_res101 / insc_convnext / insc_effnet / insc_all
#
#   Full freq-norm ablation (four-way: baseline / fdn / insc / fdn+insc):
#     ablation_fn_res50 / ablation_fn_res101
#
#   PMConv-L (reference from pmconv-scale branch):
#     pmconv_l_res50 / pmconv_l_res101 / pmconv_l_convnext / pmconv_l_effnet
#     pmconv_l_all
#
#   Full ablation (four-way: baseline / isotropic / anisotropic-L / dual-stream):
#     ablation_res50 / ablation_res101
#
#   RobustConv (isotropic ablation only):
#     robustconv_res50 / robustconv_res101 / robustconv_all
#
#   ShapeBiasNet (dual-stream):
#     imagenet100_core / imagenet100_deep / imagenet100_convnext / imagenet100_effnet
#     imagenet100_all
#
# To run a SINGLE model: replace --run_group with --model <name>
#
# Nautilus resource policy:
#   CPU  request=3, limit=3
#   RAM  request=10Gi, limit=12Gi
#   GPU  request=1, limit=1   → limits == requests  ✓
#   backoffLimit=0 — fail fast, investigate manually  ✓
#
# Submit:  kubectl apply -f combined-job.yaml
# Logs:    kubectl logs -f job/pcn-res50-img -n kc-ai-research-lab
# Delete:  kubectl delete job pcn-res50-img -n kc-ai-research-lab
# ─────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: shape-res50-img-full
  namespace: kc-ai-research-lab
spec:
  backoffLimit: 0

  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      # - NVIDIA-GeForce-RTX-3090
                      - NVIDIA-RTX-5000-Ada-Generation

      containers:
        - name: pipeline
          image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime

          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e

              # ── Step 0: Clone repo ────────────────────────────
              echo "=========================================="
              echo "  Step 0: Cloning repo (branch: shape-res)"
              echo "=========================================="
              apt-get update -qq && apt-get install -y -qq git
              git clone \
                --branch shape-res-imagenet \
                --single-branch \
                https://${GITHUB_PAT}@github.com/amit502/shapebiasnet.git \
                /shapebiasnet
              cd /shapebiasnet

              # ── Step 1: Dependencies ──────────────────────────
              echo ""
              echo "=========================================="
              echo "  Step 1: Installing dependencies"
              echo "=========================================="
              pip install -r requirements.txt --quiet

              # ── Create output dirs on PVC ─────────────────────
              CKPT_DIR="/pvc/checkpoints/layer4-fix"
              RESULTS_DIR="/pvc/results/layer4-fix"
              mkdir -p "$CKPT_DIR" "$RESULTS_DIR"

              # Clear any leftover GPU memory from previous jobs
              fuser -k /dev/nvidia* 2>/dev/null || true

              # ── Step 2: Train ─────────────────────────────────
              # ImageNet-100: 100 classes, ~128K images.
              # Much faster than full ImageNet — ~2-3 min/epoch on RTX 3090/5000.
              # Auto-resumes from checkpoint if job was preempted.
              echo ""
              echo "=========================================="
              echo "  Step 2: Training (ImageNet-100, clean data only)"
              echo "=========================================="
              rm -f "$CKPT_DIR/shape_res50_imagenet100.pt"
              python -u train.py \
                --model       shape_res50 \
                --dataset     imagenet100 \
                --data_dir    /pvc/imagenet100 \
                --ckpt_dir    "$CKPT_DIR" \
                --epochs      50 \
                --batch       64 \
                --workers     8

              # ── Step 3: Full Evaluation (clean + corruption) ──
              echo ""
              echo "=========================================="
              echo "  Step 3: Full Evaluation (ImageNet-100 val + ImageNet-100-C)"
              echo "=========================================="
              python -u eval.py \
                --model       shape_res50 \
                --dataset     imagenet100 \
                --data_dir    /pvc/imagenet100 \
                --ckpt_dir    "$CKPT_DIR" \
                --results_dir "$RESULTS_DIR" \
                --batch       64 \
                --workers     8 \
                || echo "  [WARN] Eval failed — ImageNet-100-C may not be ready."

              # # ── Step 5: Efficiency Profiling ──────────────────
              # echo ""
              # echo "=========================================="
              # echo "  Step 5: Efficiency Profiling"
              # echo "=========================================="
              # python profiler.py \
              #   --dataset     imagenet \
              #   --results_dir /pvc/results \
              #   --warmup      20 \
              #   --runs        100 || echo "  [WARN] Profiling failed — check logs."

              # ── Done ──────────────────────────────────────────
              echo ""
              echo "=========================================="
              echo "  Pipeline complete. Results:"
              echo "=========================================="
              ls -lh "$RESULTS_DIR"/
              ls -lh "$CKPT_DIR"/

          resources:
            requests:
              cpu: "3"
              memory: "10Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "3" # 6/5 = 1.2 exactly ✓
              memory: "12Gi" # 24/20 = 1.2 exactly ✓
              nvidia.com/gpu: "1" # limits == requests ✓

          env:
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: github-pat
                  key: token
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: PYTHONUNBUFFERED
              value: "1"

          volumeMounts:
            - name: data
              mountPath: /pvc
            - name: shm
              mountPath: /dev/shm

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shape-resnet-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi

      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
