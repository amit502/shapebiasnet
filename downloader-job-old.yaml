# downloader-job.yaml
# ─────────────────────────────────────────────────────────────
# Downloads ImageNet via HuggingFace and ImageNet-C via Zenodo.
# Python scripts are base64-encoded to keep YAML valid.
#
# Nautilus resource policy:
#   CPU  request=10, limit=12  -> ratio 1.2 exactly
#   RAM  request=10Gi, limit=12Gi -> ratio 1.2 exactly
#   No GPU needed
#   backoffLimit=4 for retry on preemption
#
# Submit:  kubectl apply -f k8s/downloader-job.yaml
# Logs:    kubectl logs -f job/imagenet-downloader -n kc-ai-research-lab
# Status:  kubectl get job imagenet-downloader -n kc-ai-research-lab
# Delete:  kubectl delete job imagenet-downloader -n kc-ai-research-lab
# ─────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: imagenet-downloader
  namespace: kc-ai-research-lab
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: downloader
          image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime
          command: ["/bin/bash", "-c"]
          args:
            - >-
              set -e &&
              echo "== ImageNet Download Job ==" &&
              echo "$(date)" &&

              apt-get update -qq &&
              apt-get install -y -qq aria2 tar wget &&
              pip install -q huggingface_hub datasets Pillow &&

              DATA_DIR=/pvc/imagenet &&
              mkdir -p $DATA_DIR &&

              echo "== Step 1: Downloading ImageNet via HuggingFace ==" &&
              echo  | base64 -d > /tmp/download_hf.py &&
              python3 /tmp/download_hf.py &&

              echo "== Converting to ImageFolder layout ==" &&
              echo  | base64 -d > /tmp/convert_hf.py &&
              python3 /tmp/convert_hf.py &&

              TRAIN_CLASSES=$(ls $DATA_DIR/train | wc -l) &&
              VAL_CLASSES=$(ls $DATA_DIR/val | wc -l) &&
              echo "Train classes $TRAIN_CLASSES (expect 1000)" &&
              echo "Val classes $VAL_CLASSES (expect 1000)" &&
              if [ "$TRAIN_CLASSES" -ne 1000 ] || [ "$VAL_CLASSES" -ne 1000 ]; then echo "ImageNet verification failed" && exit 1; fi &&
              echo "ImageNet ready" &&
              rm -rf $DATA_DIR/hf_cache &&

              echo "== Step 2: Downloading ImageNet-C via Zenodo ==" &&
              IMAGENET_C_DIR=$DATA_DIR/ImageNet-C &&
              mkdir -p $IMAGENET_C_DIR &&

              aria2c --max-connection-per-server=16 --split=16 --min-split-size=100M --continue=true --allow-piece-length-change=true --max-tries=10 --retry-wait=5 --dir=$IMAGENET_C_DIR --out=noise.tar   https://zenodo.org/record/2235448/files/noise.tar &&
              aria2c --max-connection-per-server=16 --split=16 --min-split-size=100M --continue=true --allow-piece-length-change=true --max-tries=10 --retry-wait=5 --dir=$IMAGENET_C_DIR --out=blur.tar    https://zenodo.org/record/3565959/files/blur.tar &&
              aria2c --max-connection-per-server=16 --split=16 --min-split-size=100M --continue=true --allow-piece-length-change=true --max-tries=10 --retry-wait=5 --dir=$IMAGENET_C_DIR --out=weather.tar https://zenodo.org/record/2235448/files/weather.tar &&
              aria2c --max-connection-per-server=16 --split=16 --min-split-size=100M --continue=true --allow-piece-length-change=true --max-tries=10 --retry-wait=5 --dir=$IMAGENET_C_DIR --out=digital.tar https://zenodo.org/record/2235448/files/digital.tar &&
              aria2c --max-connection-per-server=16 --split=16 --min-split-size=100M --continue=true --allow-piece-length-change=true --max-tries=10 --retry-wait=5 --dir=$IMAGENET_C_DIR --out=extra.tar   https://zenodo.org/record/2235448/files/extra.tar &&

              echo "Extracting ImageNet-C..." &&
              cd $IMAGENET_C_DIR &&
              for TAR in *.tar; do tar -xf $TAR --strip-components=1 -C $IMAGENET_C_DIR && rm $TAR; done &&

              echo "== All done ==" &&
              echo "$(date)" &&
              df -h /pvc &&
              ls -lh /pvc/imagenet/

          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-secret
                  key: token

          resources:
            requests:
              cpu: "10"
              memory: "10Gi"
            limits:
              cpu: "12"
              memory: "12Gi"

          volumeMounts:
            - name: data
              mountPath: /pvc

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shape-resnet-pvc
