# imagenetc-job.yaml
# Downloads and extracts ImageNet-C only.
# Skips corruptions already extracted — safe to resubmit.
# No --strip-components — extracts named folders directly.
#
# Nautilus resource policy:
#   CPU  request=5, limit=6   → ratio 1.2 exactly  ✓
#   RAM  request=10Gi, limit=12Gi → ratio 1.2 exactly  ✓
#   backoffLimit=0 — fail fast, investigate manually  ✓
#
# Submit:  kubectl apply -f k8s/imagenetc-job.yaml
# Logs:    kubectl logs -f job/imagenetc-downloader -n kc-ai-research-lab
# Delete:  kubectl delete job imagenetc-downloader -n kc-ai-research-lab
apiVersion: batch/v1
kind: Job
metadata:
  name: imagenetc-downloader
  namespace: kc-ai-research-lab
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: downloader
          image: ubuntu:22.04
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              apt-get update -qq
              apt-get install -y -qq aria2 tar

              IMAGENET_C_DIR="/pvc/imagenet/ImageNet-C"
              mkdir -p "$IMAGENET_C_DIR"

              echo "$(date) Starting ImageNet-C download+extraction"

              # Extract noise.tar if already on disk but not yet extracted
              if [ -f "$IMAGENET_C_DIR/noise.tar" ] && [ ! -f "$IMAGENET_C_DIR/.noise_done" ]; then
                echo "$(date) Extracting existing noise.tar..."
                tar -xf "$IMAGENET_C_DIR/noise.tar" -C "$IMAGENET_C_DIR"
                rm "$IMAGENET_C_DIR/noise.tar"
                touch "$IMAGENET_C_DIR/.noise_done"
                echo "$(date) noise extraction complete"
              fi

              for NAME_URL in \
                "noise.tar|https://zenodo.org/records/2235448/files/noise.tar" \
                "blur.tar|https://zenodo.org/records/2235448/files/blur.tar" \
                "weather.tar|https://zenodo.org/records/2235448/files/weather.tar" \
                "digital.tar|https://zenodo.org/records/2235448/files/digital.tar" \
                "extra.tar|https://zenodo.org/records/2235448/files/extra.tar"
              do
                NAME=$(echo "$NAME_URL" | cut -d'|' -f1)
                URL=$(echo "$NAME_URL"  | cut -d'|' -f2)
                CORR=$(echo "$NAME"     | cut -d'.' -f1)

                # Skip if already extracted — check for named corruption folders
                # noise → gaussian_noise, blur → defocus_blur, etc.
                # Use a marker file to track completion reliably
                if [ -f "$IMAGENET_C_DIR/.${CORR}_done" ]; then
                  echo "$(date) [SKIP] $CORR already done"
                  continue
                fi

                # Skip download if tar already on disk
                if [ -f "$IMAGENET_C_DIR/$NAME" ]; then
                  echo "$(date) [SKIP DOWNLOAD] $NAME already on disk"
                else
                  echo "$(date) Downloading $NAME..."
                  aria2c \
                    --max-connection-per-server=16 \
                    --split=16 \
                    --min-split-size=100M \
                    --continue=true \
                    --max-tries=0 \
                    --retry-wait=10 \
                    --dir="$IMAGENET_C_DIR" \
                    --out="$NAME" \
                    "$URL"
                  echo "$(date) $NAME download complete"
                fi

                echo "$(date) Extracting $NAME..."
                tar -xf "$IMAGENET_C_DIR/$NAME" -C "$IMAGENET_C_DIR"
                rm "$IMAGENET_C_DIR/$NAME"
                touch "$IMAGENET_C_DIR/.${CORR}_done"
                echo "$(date) $CORR extraction complete"
              done

              echo "====== Verification ======"
              MISSING=0
              for CORR in gaussian_noise shot_noise impulse_noise \
                          defocus_blur glass_blur motion_blur zoom_blur \
                          snow frost fog brightness \
                          contrast elastic_transform pixelate jpeg_compression
              do
                if [ -d "$IMAGENET_C_DIR/$CORR" ]; then
                  echo "  ✓ $CORR"
                else
                  echo "  ✗ MISSING: $CORR"
                  MISSING=$((MISSING + 1))
                fi
              done
              if [ "$MISSING" -ne 0 ]; then
                echo "$MISSING corruptions missing"
                exit 1
              fi

              echo "$(date) ImageNet-C complete!"
              ls "$IMAGENET_C_DIR"
              df -h /pvc

          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "2" # 6/5 = 1.2 exactly ✓
              memory: "4Gi" # 12/10 = 1.2 exactly ✓

          volumeMounts:
            - name: data
              mountPath: /pvc

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shape-resnet-pvc
