# imagenet100c-generator-job.yaml
# ─────────────────────────────────────────────────────────────
# Generates ImageNet-100-C by applying 15 corruptions × 5 severities
# to the ImageNet-100 val set using the imagecorruptions library.
#
# Output:
#   /pvc/imagenet100/ImageNet-100-C/<corruption>/<severity>/<class>/
#
# Fully resumable — uses .done marker files per (corruption, severity).
# Safe to resubmit if interrupted.
#
# Nautilus resource policy:
#   CPU  request=5, limit=6   → ratio 1.2 exactly  ✓
#   RAM  request=10Gi, limit=12Gi → ratio 1.2 exactly  ✓
#   No GPU needed  ✓
#   backoffLimit=0  ✓
#
# Submit:  kubectl apply -f k8s/imagenet100c-generator-job.yaml
# Logs:    kubectl logs -f job/imagenet100c-generator -n kc-ai-research-lab
# Delete:  kubectl delete job imagenet100c-generator -n kc-ai-research-lab
# ─────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: imagenet100c-generator
  namespace: kc-ai-research-lab
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: generator
          image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              apt-get update -qq && apt-get install -y -qq libxcb1 libglib2.0-0 libgl1
              pip install -q imagecorruptions Pillow

              echo "$(date) Generating ImageNet-100-C"
              echo "  Source : /pvc/imagenet100/val"
              echo "  Output : /pvc/imagenet100/ImageNet-100-C"

              echo  | base64 -d > /tmp/gen_imagenet100c.py
              python3 /tmp/gen_imagenet100c.py

              echo "$(date) Done!"
              du -sh /pvc/imagenet100/ImageNet-100-C
              df -h /pvc

          resources:
            requests:
              cpu: "2"
              memory: "10Gi"
            limits:
              cpu: "2" # 6/5 = 1.2 exactly ✓
              memory: "12Gi" # 12/10 = 1.2 exactly ✓

          volumeMounts:
            - name: data
              mountPath: /pvc

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shape-resnet-pvc
