# learn-cifar-job.yaml
# ─────────────────────────────────────────────────────────────
# shape_res50 with learnable ShapeDiffusion — CIFAR-10 + CIFAR-100
#
# Models : shape_res50
# Dataset: cifar10, cifar100
# Seed   : 42
# Epochs : 40
# Total  : 1 model x 2 datasets x 1 seed = 2 runs (~1 hour)
#
# Checkpoints : /pvc/checkpoints/learn-diffusion-cifar/seed-42/
# Results     : /pvc/results/learn-diffusion-cifar/seed-42/
#
# Submit:  kubectl apply -f learn-cifar-job.yaml
# Logs:    kubectl logs -f job/shape-res50-learn-cifar -n kc-ai-research-lab
# Delete:  kubectl delete job shape-res50-learn-cifar -n kc-ai-research-lab
# ─────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: shape-res50-learn-cifar
  namespace: kc-ai-research-lab
spec:
  backoffLimit: 0

  template:
    spec:
      restartPolicy: Never
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-RTX-5000-Ada-Generation

      containers:
        - name: pipeline
          image: pytorch/pytorch:2.2.0-cuda12.1-cudnn8-runtime

          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e

              echo "=========================================="
              echo "  Cloning repo (branch: shape-res-learn)"
              echo "=========================================="
              apt-get update -qq && apt-get install -y -qq git
              git clone \
                --branch shape-res-learn \
                --single-branch \
                https://${GITHUB_PAT}@github.com/amit502/shapebiasnet.git \
                /shapebiasnet
              cd /shapebiasnet

              pip install -r requirements.txt --quiet
              nvidia-smi

              set +e

              SEED=42
              CKPT_DIR="/pvc/checkpoints/learn-diffusion-cifar/seed-${SEED}"
              RESULTS_DIR="/pvc/results/learn-diffusion-cifar/seed-${SEED}"
              mkdir -p "$CKPT_DIR" "$RESULTS_DIR"

              PASS=0
              FAIL=0

              for DATASET in cifar10 cifar100; do
                DATA_DIR="/pvc/${DATASET}"

                echo ""
                echo "============================================================"
                echo "  MODEL=shape_res50  DATASET=$DATASET  SEED=$SEED"
                echo "============================================================"

                rm -f "$CKPT_DIR/shape_res50_${DATASET}.pt"

                python -u train.py \
                  --model    shape_res50 \
                  --dataset  $DATASET \
                  --data_dir $DATA_DIR \
                  --ckpt_dir $CKPT_DIR \
                  --epochs   40 \
                  --batch    128 \
                  --workers  4 \
                  --seed     $SEED
                TRAIN_STATUS=$?

                if [ $TRAIN_STATUS -ne 0 ]; then
                  echo "  [ERROR] Training failed — skipping eval."
                  FAIL=$((FAIL + 1))
                  continue
                fi

                python -u eval.py \
                  --model       shape_res50 \
                  --dataset     $DATASET \
                  --data_dir    $DATA_DIR \
                  --ckpt_dir    $CKPT_DIR \
                  --results_dir $RESULTS_DIR \
                  --batch       128 \
                  --workers     4
                EVAL_STATUS=$?

                if [ $EVAL_STATUS -ne 0 ]; then
                  echo "  [WARN] Eval failed for $DATASET"
                  FAIL=$((FAIL + 1))
                else
                  PASS=$((PASS + 1))
                  echo "  [OK] shape_res50 $DATASET done."
                fi
              done

              echo ""
              echo "============================================================"
              echo "  Done.  Passed: $PASS   Failed: $FAIL"
              echo "============================================================"
              ls "$RESULTS_DIR"/

          resources:
            requests:
              cpu: "3"
              memory: "9Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "3"
              memory: "10Gi"
              nvidia.com/gpu: "1"

          env:
            - name: GITHUB_PAT
              valueFrom:
                secretKeyRef:
                  name: github-pat
                  key: token
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: "expandable_segments:True"
            - name: PYTHONUNBUFFERED
              value: "1"

          volumeMounts:
            - name: data
              mountPath: /pvc
            - name: shm
              mountPath: /dev/shm

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shape-resnet-pvc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi

      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
